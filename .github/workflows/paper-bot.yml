name: Paper Bot Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paper-mode safety check
        env:
          TRADING_MODE: paper
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: python trade_engine.py --once
